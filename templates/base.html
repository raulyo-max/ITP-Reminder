<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ITP Reminder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">ITP Reminder</div>

    <nav>
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('clients') }}">Clienți</a>
      <a href="{{ url_for('appointments') }}">Programări</a>
      <a href="{{ url_for('messages') }}">Mesaje</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
